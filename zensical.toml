[project]
site_name = "Physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model of losartan"
site_url = "https://matthiaskoenig.github.io/losartan-model/"
site_description = "This repository provides the losartan physiologically based pharmacokinetic/pharmacodynamic (PBPK/PD) model: the oral absorption of losartan, its distribution, its hepatic metabolism to the active metabolite E3174 (CYP2C9) and to inactive metabolites, the renal and biliary excretion of losartan and its metabolites, and the blockade of the AT1 receptor by E3174 with its effects on renin, angiotensin, aldosterone and the blood pressure."
site_author = "Ennie Tensil, Mariia Myshkina and Matthias König"

copyright = "Copyright &copy; 2024-2026 Ennie Tensil, Mariia Myshkina and Matthias König"

# pages as `simulations.html`, so the reports which the docs workflow copies into
# the site (`simulations/`, `fit/`) do not replace the pages of the same name
use_directory_urls = false

repo_url = "https://github.com/matthiaskoenig/losartan-model"
repo_name = "matthiaskoenig/losartan-model"

nav = [
  { "Home" = "index.md" },
  { "Running the model" = "running.md" },
  { "Models" = "models.md" },
  { "Simulations" = "simulations.md" },
  { "Fit" = "fit.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/losartan-model"
